services:
  - type: web
    name: sierra-sdp-fuel-reports
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: COMPANY_NAME
        value: Hilos y Algodón, S.A.
      - key: MONDAY_API_TOKEN
        sync: false
      - key: MONDAY_WEBHOOK_SECRET
        sync: false
      - key: MONDAY_REQUIRE_JWT
        value: "false"
      - key: MONDAY_BOARD_ID
        value: "18433758498"
      - key: MONDAY_TRIGGER_COLUMN_ID
        value: color_mm7r9b1w
      - key: MONDAY_TRIGGER_LABEL
        value: Aprobado para generar
      - key: MONDAY_REPORT_PDF_COLUMN_ID
        value: file_mm7rp1y1
      - key: MONDAY_API_VERSION
        value: "2026-10"
      - key: INCLUDE_AUTHORIZATION_LINES
        value: "true"
      - key: FUEL_RATE_CURRENCY
        value: USD
      - key: REIMBURSEMENT_CURRENCY
        value: GTQ

